<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#101827" />
<title>공학용 계산기 | Scientific Calculator</title>
<style>
:root{font-family:Inter, Pretendard, -apple-system, BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#0a101c;--panel:#111c2c;--panel2:#17253a;--stroke:#2c405b;--text:#f5f8ff;--muted:#91a4be;--accent:#55d6c2;--blue:#5ca8ff;--btn:#1c2d43;--btnhover:#29415d;--danger:#ff8a9b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 5%,#19304b 0%,transparent 40%),radial-gradient(ellipse at 95% 100%,#113b3a 0%,transparent 39%),var(--bg);color:var(--text);display:flex;justify-content:center;padding:28px 18px}
.app{width:min(100%,1050px)}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.eyebrow{margin:0 0 6px;color:var(--accent);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}h1{font-size:clamp(24px,4vw,34px);margin:0;letter-spacing:-.055em}header .sub{color:var(--muted);font-size:13px;margin:8px 0 0}.pill{border:1px solid var(--stroke);border-radius:99px;padding:9px 13px;color:var(--muted);font-size:12px;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 278px;gap:16px;align-items:start}.calculator,.history{background:linear-gradient(150deg,#152236ee,#101a2aee);border:1px solid #30415a;border-radius:24px;box-shadow:0 22px 65px #0003;overflow:hidden}.calculator{padding:20px}.screen{border:1px solid #304962;background:linear-gradient(125deg,#0a1423,#132439);border-radius:18px;padding:20px;min-height:172px;display:flex;flex-direction:column;justify-content:space-between;position:relative}.screen-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.mode{background:#1c3544;color:var(--accent);border:1px solid #356c70;border-radius:9px;padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.05em;cursor:pointer}.screen-label{color:var(--muted);font-size:12px}.expression{color:#c3d4e8;font-size:clamp(19px,3vw,25px);font-weight:500;text-align:right;word-break:break-all;min-height:35px;margin:14px 0 0;line-height:1.5}.result{text-align:right;font-size:clamp(32px,6vw,46px);font-weight:750;letter-spacing:-.05em;word-break:break-all;line-height:1.2;min-height:58px}.error{color:var(--danger);font-size:22px}.tools{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:15px 0 13px;flex-wrap:wrap}.tool-left,.tool-right{display:flex;gap:7px;align-items:center}.tool{font:inherit;background:#192a40;border:1px solid #304660;color:var(--muted);padding:8px 11px;border-radius:9px;cursor:pointer;font-size:12px}.tool:hover{background:#29405a;color:white}.tool.active{color:var(--accent);border-color:#337c79}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.key{border:1px solid transparent;background:var(--btn);color:var(--text);min-height:61px;border-radius:13px;cursor:pointer;font:600 17px inherit;font-family:inherit;font-size:17px;font-weight:650;transition:background .12s,transform .1s,border-color .12s;touch-action:manipulation;user-select:none}.key:hover{background:var(--btnhover);border-color:#3a5573}.key:active{transform:scale(.955)}.key:focus-visible,.tool:focus-visible,.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.key.fn{background:#172b3d;color:#8bded2;font-size:15px}.key.fn:hover{background:#22475a}.key.op{background:#22334d;color:#9dc8ff;font-size:21px}.key.utility{color:#ffafb7}.key.equal{background:linear-gradient(140deg,#63e1ce,#33bea9);color:#062a2a;font-size:26px}.key.equal:hover{background:#85ebdb}.key small{font-size:11px}.footer{display:flex;justify-content:space-between;gap:10px;color:#7f94ad;font-size:11px;margin-top:14px}.history{padding:19px;min-height:535px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.history h2{font-size:16px;margin:0}.history-head button{background:transparent;border:0;color:#93a9c5;cursor:pointer;font-size:12px}.history-head button:hover{color:white}.history-list{display:flex;flex-direction:column;gap:9px;margin-top:17px;max-height:535px;overflow:auto}.empty{display:grid;place-content:center;text-align:center;gap:11px;min-height:245px;color:#8499b4;font-size:13px;line-height:1.7}.empty span{font-size:32px}.history-item{border:1px solid #2b405c;background:#15263b;padding:12px;border-radius:12px;cursor:pointer;text-align:right;color:inherit;width:100%;font-family:inherit}.history-item:hover{background:#233851}.history-exp{font-size:12px;color:#91a7c1;overflow-wrap:anywhere}.history-val{font-size:19px;font-weight:750;margin-top:5px;overflow-wrap:anywhere}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:800px){.layout{grid-template-columns:1fr}.history{min-height:0}.history-list{max-height:240px}.empty{min-height:100px}.pill{display:none}}
@media(max-width:520px){body{padding:16px 10px}.heading{margin:2px 5px 16px}.calculator{padding:11px;border-radius:18px}.screen{padding:15px;min-height:150px}.grid{gap:6px}.key{min-height:56px;border-radius:10px;font-size:16px}.key.fn{font-size:13px}.key.op{font-size:19px}.tools{padding:12px 1px}.tool{padding:8px 9px}.footer{font-size:10px}.history{border-radius:18px}}
@media(max-width:365px){.key{min-height:50px;font-size:15px}.key.fn{font-size:12px}.tool{font-size:11px;padding:7px}.grid{gap:5px}}
</style>
</head>
<body>
<main class="app">
<header class="heading"><div><p class="eyebrow">SMART WORKSPACE / TOOLS</p><h1>공학용 계산기<span style="color:var(--accent)">.</span></h1><p class="sub">정밀한 계산을 위한 깔끔하고 직관적인 도구</p></div><span class="pill">SCIENTIFIC CALCULATOR</span></header>
<div class="layout">
<section class="calculator" aria-label="공학용 계산기">
<div class="screen"><div class="screen-top"><span class="screen-label">CALCULATION</span><button class="mode" id="mode" aria-label="각도 단위 전환">DEG ▾</button></div><div id="expression" class="expression" aria-label="입력 식">0</div><div class="result" id="result" aria-live="polite">0</div></div>
<div class="tools"><div class="tool-left"><button class="tool" data-action="memory-clear" title="메모리 초기화">MC</button><button class="tool" data-action="memory-recall" title="메모리 불러오기">MR</button><button class="tool" data-action="memory-add" title="메모리에 더하기">M+</button><button class="tool" data-action="memory-sub" title="메모리에서 빼기">M−</button></div><div class="tool-right"><button class="tool" id="second" aria-pressed="false">2nd OFF</button><button class="tool" data-action="copy" title="계산 결과 복사">복사</button></div></div>
<div class="grid" id="keyboard">
<button class="key fn" data-insert="sin(" data-second="asin(" data-label="sin">sin</button><button class="key fn" data-insert="cos(" data-second="acos(" data-label="cos">cos</button><button class="key fn" data-insert="tan(" data-second="atan(" data-label="tan">tan</button><button class="key fn" data-insert="ln(" data-second="exp(" data-label="ln">ln</button><button class="key fn" data-insert="log(" data-second="10^(" data-label="log">log</button>
<button class="key fn" data-insert="(" >(</button><button class="key fn" data-insert=")">)</button><button class="key fn" data-insert="^2" data-second="^3" data-label="x²">x²</button><button class="key fn" data-insert="^" data-second="^(1/" data-label="xʸ">xʸ</button><button class="key fn" data-insert="sqrt(" data-second="cbrt(" data-label="√x">√x</button>
<button class="key fn" data-insert="π">π</button><button class="key fn" data-insert="e">e</button><button class="key fn" data-insert="!">n!</button><button class="key fn" data-insert="%">%</button><button class="key utility" data-action="clear">AC</button>
<button class="key" data-insert="7">7</button><button class="key" data-insert="8">8</button><button class="key" data-insert="9">9</button><button class="key op" data-insert="÷">÷</button><button class="key utility" data-action="backspace">⌫</button>
<button class="key" data-insert="4">4</button><button class="key" data-insert="5">5</button><button class="key" data-insert="6">6</button><button class="key op" data-insert="×">×</button><button class="key fn" data-insert="1/(" title="역수">1/x</button>
<button class="key" data-insert="1">1</button><button class="key" data-insert="2">2</button><button class="key" data-insert="3">3</button><button class="key op" data-insert="−">−</button><button class="key fn" data-insert="abs(" title="절댓값">|x|</button>
<button class="key" data-insert="0">0</button><button class="key" data-insert=".">.</button><button class="key fn" data-insert="Ans">Ans</button><button class="key op" data-insert="+">+</button><button class="key equal" data-action="equals">=</button>
</div>
<div class="footer"><span>⌨ 숫자 · 연산자 · Enter · Backspace</span><span id="memory-status">메모리 비어 있음</span></div>
</section>
<aside class="history" aria-label="계산 기록"><div class="history-head"><h2>계산 기록</h2><button id="clear-history">전체 삭제</button></div><div class="history-list" id="history-list"><div class="empty"><span>◷</span>아직 계산 기록이 없습니다.<br>계산을 완료하면 여기에 표시됩니다.</div></div></aside>
</div>
</main>
<script>
'use strict';
(()=>{
 const $=id=>document.getElementById(id);
 const expressionEl=$('expression'),resultEl=$('result'),historyEl=$('history-list');
 let expr='',answer=0,memory=0,degree=true,second=false,lastResult=0,history=[];
 try{history=JSON.parse(localStorage.getItem('sciCalcHistory')||'[]');if(!Array.isArray(history))history=[];}catch{history=[]}
 const normalize=x=>Math.abs(x)<1e-13?0:x;
 const fmt=n=>{if(!Number.isFinite(n))throw Error('정의되지 않은 결과');n=normalize(n);if(Number.isInteger(n)&&Math.abs(n)<1e15)return String(n);return Number(n.toPrecision(12)).toString();};
 function tokenize(s){const out=[];let i=0;while(i<s.length){const z=s.slice(i);if(/^\s/.test(z)){i++;continue;}let m;
 if((m=z.match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+\-]?\d+)?/))){out.push({t:'num',v:Number(m[0])});i+=m[0].length;continue;}
 if((m=z.match(/^(?:asin|acos|atan|sqrt|cbrt|sin|cos|tan|log|ln|exp|abs|Ans)/))){out.push({t:m[0]});i+=m[0].length;continue;}
 if('πe()+−-×*÷/^!%'.includes(s[i])){out.push({t:s[i]});i++;continue;}throw Error('인식할 수 없는 입력');}return out;}
 function evaluate(s){const ts=tokenize(s);let p=0;const curr=()=>ts[p]?.t;const eat=x=>{if(curr()===x){p++;return true}return false};const expect=x=>{if(!eat(x))throw Error('괄호 또는 수식 확인 필요')};
 const rad=x=>degree?x*Math.PI/180:x;const inverse=x=>degree?x*180/Math.PI:x;
 function factorial(x){if(!Number.isInteger(x)||x<0||x>170)throw Error('팩토리얼은 0~170의 정수만 가능');let v=1;for(let k=2;k<=x;k++)v*=k;return v}
 const funcs={sin:x=>Math.sin(rad(x)),cos:x=>Math.cos(rad(x)),tan:x=>{if(Math.abs(Math.cos(rad(x)))<1e-12)throw Error('정의되지 않은 탄젠트');return Math.tan(rad(x))},asin:x=>inverse(Math.asin(x)),acos:x=>inverse(Math.acos(x)),atan:x=>inverse(Math.atan(x)),sqrt:Math.sqrt,cbrt:Math.cbrt,ln:Math.log,log:Math.log10,exp:Math.exp,abs:Math.abs};
 function atom(){let t=curr();if(t==='num'){p++;return ts[p-1].v}if(eat('π'))return Math.PI;if(eat('e'))return Math.E;if(eat('Ans'))return answer;if(eat('(')){let x=sum();expect(')');return x}if(funcs[t]){p++;expect('(');let x=sum();expect(')');return funcs[t](x)}throw Error('수식을 확인해 주세요')}
 function power(){let v=atom();while(curr()==='!'||curr()==='%'){if(eat('!'))v=factorial(v);else if(eat('%'))v/=100}if(eat('^'))v=Math.pow(v,unary());return v}
 function unary(){if(eat('+'))return unary();if(eat('−')||eat('-'))return -unary();return power()}
 function product(){let v=unary();while(true){if(eat('×')||eat('*'))v*=unary();else if(eat('÷')||eat('/'))v/=unary();else if(curr()==='('||curr()==='π'||curr()==='e'||curr()==='Ans'||curr()==='num'||funcs[curr()])v*=unary();else break}return v}
 function sum(){let v=product();while(true){if(eat('+'))v+=product();else if(eat('−')||eat('-'))v-=product();else break}return v}
 let v=sum();if(p!==ts.length)throw Error('수식 형식 오류');if(!Number.isFinite(v))throw Error('계산할 수 없는 값');return normalize(v)}
 function preview(){expressionEl.textContent=expr||'0';expressionEl.scrollLeft=expressionEl.scrollWidth;if(!expr){resultEl.textContent='0';resultEl.classList.remove('error');lastResult=0;return}try{lastResult=evaluate(expr);resultEl.textContent=fmt(lastResult);resultEl.classList.remove('error')}catch{resultEl.textContent='…';resultEl.classList.remove('error')}}
 function insert(s){expr+=s;preview()}
 function calculate(){if(!expr)return;try{let v=evaluate(expr),value=fmt(v);history.unshift({expr,value,deg:degree});history=history.slice(0,30);try{localStorage.setItem('sciCalcHistory',JSON.stringify(history))}catch{}renderHistory();answer=v;expr=value;preview()}catch(e){resultEl.textContent=e.message||'계산 오류';resultEl.classList.add('error')}}
 function memoryChange(kind){let value;try{value=expr?evaluate(expr):lastResult}catch{value=lastResult}if(kind==='memory-clear')memory=0;if(kind==='memory-recall'){insert('('+fmt(memory)+')');return}if(kind==='memory-add')memory+=value;if(kind==='memory-sub')memory-=value;$('memory-status').textContent=memory===0?'메모리 비어 있음':'M = '+fmt(memory)}
 const labels={'asin(':'sin⁻¹','acos(':'cos⁻¹','atan(':'tan⁻¹','exp(':'eˣ','10^(':'10ˣ','^3':'x³','^(1/':'ʸ√x','cbrt(':'∛x'};
 function setSecond(){second=!second;$('second').textContent=second?'2nd ON':'2nd OFF';$('second').classList.toggle('active',second);$('second').setAttribute('aria-pressed',second);document.querySelectorAll('[data-second]').forEach(b=>b.textContent=second?labels[b.dataset.second]:b.dataset.label)}
 function act(action){switch(action){case'clear':expr='';preview();break;case'backspace':expr=expr.slice(0,-1);preview();break;case'equals':calculate();break;case'copy':{const text=resultEl.textContent;if(text==='…')return;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>{const b=document.querySelector('[data-action=copy]');b.textContent='복사됨';setTimeout(()=>b.textContent='복사',1100)}).catch(()=>{});break}default:if(action.startsWith('memory-'))memoryChange(action)}}
 $('keyboard').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action)act(b.dataset.action);else if(b.dataset.insert)insert(second&&b.dataset.second?b.dataset.second:b.dataset.insert)});
 document.querySelector('.tools').addEventListener('click',e=>{const b=e.target.closest('button');if(b?.dataset.action)act(b.dataset.action)});
 $('mode').addEventListener('click',()=>{degree=!degree;$('mode').textContent=degree?'DEG ▾':'RAD ▾';preview()});$('second').addEventListener('click',setSecond);
 $('clear-history').addEventListener('click',()=>{history=[];try{localStorage.removeItem('sciCalcHistory')}catch{}renderHistory()});
 function renderHistory(){historyEl.replaceChildren();if(!history.length){const d=document.createElement('div');d.className='empty';d.innerHTML='<span>◷</span>아직 계산 기록이 없습니다.<br>계산을 완료하면 여기에 표시됩니다.';historyEl.append(d);return}history.forEach(item=>{const b=document.createElement('button');b.className='history-item';b.title='클릭하면 수식 복원';const top=document.createElement('div'),bottom=document.createElement('div');top.className='history-exp';bottom.className='history-val';top.textContent=item.expr+'  ·  '+(item.deg?'DEG':'RAD');bottom.textContent='= '+item.value;b.append(top,bottom);b.addEventListener('click',()=>{expr=item.expr;degree=item.deg;$('mode').textContent=degree?'DEG ▾':'RAD ▾';preview();window.scrollTo({top:0,behavior:'smooth'})});historyEl.append(b)})}
 document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA'].includes(e.target.tagName))return;const k=e.key;if(/^\d$/.test(k)||k==='.'||k==='('||k===')'||k==='+'||k==='^'||k==='%'||k==='!'){insert(k);e.preventDefault()}else if(k==='*'){insert('×');e.preventDefault()}else if(k==='/'){insert('÷');e.preventDefault()}else if(k==='-'){insert('−');e.preventDefault()}else if(k==='Enter'||k==='='){calculate();e.preventDefault()}else if(k==='Backspace'){act('backspace');e.preventDefault()}else if(k==='Escape'||k==='Delete'){act('clear');e.preventDefault()}});
 renderHistory();preview();
})();
</script>
</body>
</html>
